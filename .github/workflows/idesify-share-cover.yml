name: Render Idesify share cover
on:
  push:
    paths:
      - 'idesify/share-cover.svg'
      - '.github/workflows/idesify-share-cover.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || true
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: |
          node -e "const {chromium}=require('playwright'); (async()=>{const b=await chromium.launch({headless:true});const p=await b.newPage({viewport:{width:1200,height:630},deviceScaleFactor:1});await p.goto('file://'+process.cwd()+'/idesify/share-cover.svg');await p.screenshot({path:'idesify/share-cover.png'});await b.close()})().catch(e=>{console.error(e);process.exit(1)})"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add idesify/share-cover.png
          git diff --cached --quiet || git commit -m "Render Idesify WhatsApp preview PNG"
          git push
